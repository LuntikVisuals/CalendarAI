<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a12">
  <title>Календарь ИИ</title>
  <style>
    :root { --glass: rgba(255,255,255,0.1); --border: rgba(255,255,255,0.2); --accent: #a78bfa; --cyan: #22d3ee; }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:linear-gradient(160deg,#0a0a12,#1a1030,#0c1a2e);color:#f5f5f7;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
    header{padding:14px 16px;background:var(--glass);backdrop-filter:blur(24px);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
    h1{font-size:18px;font-weight:600}
    .content{flex:1;overflow-y:auto;padding:12px;padding-bottom:24px}
    .weekdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;color:#888;margin-bottom:6px}
    .calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:16px}
    .day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:var(--glass);border:1px solid var(--border);border-radius:12px;font-size:14px}
    .day.today{background:linear-gradient(135deg,var(--accent),var(--cyan));color:#fff;border:none;font-weight:600}
    .day.has-task{box-shadow:inset 0 0 0 2px var(--cyan)}
    .day.selected{outline:2px solid #fff;outline-offset:1px}
    #selectedDate{font-size:16px;font-weight:600;margin-bottom:10px}
    .add-form{display:flex;gap:6px;margin-bottom:12px}
    .add-form input{flex:1;background:var(--glass);border:1px solid var(--border);border-radius:20px;padding:12px 14px;color:#fff;font-size:15px;outline:none}
    .add-form button{background:linear-gradient(135deg,var(--accent),var(--cyan));color:#fff;border:none;padding:12px 14px;border-radius:20px;font-weight:600}
    .plan-btn{width:100%;background:linear-gradient(135deg,#22c55e,#06b6d4);color:#fff;border:none;padding:14px;border-radius:14px;font-size:15px;font-weight:600;margin-bottom:12px}
    .task{background:var(--glass);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
    .task button{background:none;border:none;color:#f87171;font-size:18px}
    .plan{background:var(--glass);border:1px solid var(--border);border-radius:14px;padding:14px;white-space:pre-wrap;line-height:1.5;font-size:14px}
    .holiday{color:#fbbf24;font-size:12px}
  </style>
</head>
<body>
  <header><h1>Календарь ИИ</h1><div id="dateDisplay"></div></header>
  <div class="content">
    <div class="weekdays"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span></div>
    <div class="calendar" id="calendar"></div>
    <div id="dayView">
      <h2 id="selectedDate"></h2>
      <div class="add-form"><input id="taskInput" placeholder="Добавить задачу..."><button id="addBtn">+</button></div>
      <button class="plan-btn" id="planBtn">Спланировать день</button>
      <div id="tasks"></div>
      <div id="plan" class="plan" style="display:none"></div>
    </div>
  </div>
  <script>
    const holidays={"01-01":"Новый год","01-07":"Рождество","02-23":"День защитника Отечества","03-08":"Международный женский день","05-01":"Праздник Весны и Труда","05-09":"День Победы","06-12":"День России","11-04":"День народного единства","12-31":"Новый год"};
    let tasks=JSON.parse(localStorage.getItem("calendar_tasks")||"{}");
    let selected=new Date(), currentMonth=new Date(selected.getFullYear(),selected.getMonth(),1);
    const calendarEl=document.getElementById("calendar"), tasksEl=document.getElementById("tasks"), planEl=document.getElementById("plan"), selectedDateEl=document.getElementById("selectedDate"), dateDisplay=document.getElementById("dateDisplay"), taskInput=document.getElementById("taskInput");
    function formatDate(d){return d.toISOString().split("T")[0];}
    function renderCalendar(){
      calendarEl.innerHTML="";
      const y=currentMonth.getFullYear(), m=currentMonth.getMonth();
      const first=new Date(y,m,1).getDay(), days=new Date(y,m+1,0).getDate(), off=first===0?6:first-1;
      dateDisplay.textContent=currentMonth.toLocaleString("ru",{month:"long",year:"numeric"});
      for(let i=0;i<off;i++) calendarEl.appendChild(document.createElement("div"));
      const today=formatDate(new Date()), sel=formatDate(selected);
      for(let d=1;d<=days;d++){
        const dt=new Date(y,m,d), k=formatDate(dt), div=document.createElement("div");
        div.className="day"; div.textContent=d;
        if(k===today) div.classList.add("today");
        if(k===sel) div.classList.add("selected");
        if(tasks[k]?.length) div.classList.add("has-task");
        div.onclick=()=>{selected=dt;render();};
        calendarEl.appendChild(div);
      }
    }
    function renderTasks(){
      const k=formatDate(selected);
      selectedDateEl.textContent=selected.toLocaleDateString("ru",{weekday:"long",day:"numeric",month:"long"});
      const md=(selected.getMonth()+1).toString().padStart(2,"0")+"-"+selected.getDate().toString().padStart(2,"0");
      if(holidays[md]) selectedDateEl.innerHTML+=` <span class="holiday">${holidays[md]}</span>`;
      tasksEl.innerHTML="";
      (tasks[k]||[]).forEach((t,i)=>{
        const div=document.createElement("div");
        div.className="task";
        div.innerHTML=`<span>${t}</span><button onclick="removeTask('${k}',${i})">×</button>`;
        tasksEl.appendChild(div);
      });
      planEl.style.display="none";
    }
    function removeTask(k,i){tasks[k].splice(i,1); if(!tasks[k].length) delete tasks[k]; localStorage.setItem("calendar_tasks",JSON.stringify(tasks)); render();}
    function render(){renderCalendar(); renderTasks();}
    document.getElementById("addBtn").onclick=()=>{
      const t=taskInput.value.trim(); if(!t) return;
      const k=formatDate(selected); if(!tasks[k]) tasks[k]=[]; tasks[k].push(t);
      localStorage.setItem("calendar_tasks",JSON.stringify(tasks)); taskInput.value=""; render();
    };
    document.getElementById("planBtn").onclick=()=>{
      const k=formatDate(selected), ts=tasks[k]||[];
      const md=(selected.getMonth()+1).toString().padStart(2,"0")+"-"+selected.getDate().toString().padStart(2,"0");
      let p=`План на ${selected.toLocaleDateString("ru")}:\n\n`;
      if(holidays[md]) p+=`🎉 Сегодня ${holidays[md]}\n\n`;
      if(!ts.length) p+="Задач нет. Можно отдохнуть или заняться чем-то своим.";
      else { p+="Задачи:\n"; ts.forEach((t,i)=>p+=`${i+1}. ${t}\n`); p+="\nСначала важное, потом остальное."; }
      planEl.textContent=p; planEl.style.display="block";
    };
    taskInput.onkeydown=e=>{if(e.key==="Enter") document.getElementById("addBtn").click();};
    let sx=0; document.addEventListener("touchstart",e=>sx=e.touches[0].clientX);
    document.addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>50){currentMonth.setMonth(currentMonth.getMonth()+(dx>0?-1:1)); render();}});
    render();
  </script>
</body>
</html>
